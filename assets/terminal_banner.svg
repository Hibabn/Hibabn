<svg viewBox="0 0 1650 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ttl">Hiba Ben Amor terminal banner</title>
<desc id="desc">Terminal-style profile banner with system info and a dot-matrix HB monogram, in a pink color palette.</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1a0a14"/>
    <stop offset="100%" stop-color="#0f0710"/>
  </linearGradient>
  <linearGradient id="frameGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff2e93"/>
    <stop offset="50%" stop-color="#ff8fc7"/>
    <stop offset="100%" stop-color="#ff2e93"/>
  </linearGradient>
  <style>
    .mono { font-family: 'Fira Code','Courier New',monospace; }
    .lbl { fill:#ff7fc0; font-size:20px; font-weight:bold; letter-spacing:1px; }
    .val { fill:#ffe3f2; font-size:20px; }
    .valstrong { fill:#ffffff; font-size:20px; font-weight:bold; }
    .dim { fill:#8a6478; font-size:18px; }
    .head { fill:#ff53a2; font-size:24px; font-weight:bold; letter-spacing:2px; }
    .bar { fill:#c98fb0; font-size:19px; }
    .dotmain { fill:#ff4fa3; }
    .dotfaint { fill:#7a3a5c; opacity:0.6; }
    .netline { stroke:#ff4fa3; stroke-width:1; opacity:0.25; }
  </style>
</defs>

<rect x="0" y="0" width="1650" height="560" rx="18" fill="url(#bgGrad)"/>
